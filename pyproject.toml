[build-system]
requires = ["setuptools>=61", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "vocd"
version = "0.1.0"
description = "Viterbi Online Change-point Detection: robust, deterministic change-point detection with multiple-testing control"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pybind11>=2.10"]
bench = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["vocd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
